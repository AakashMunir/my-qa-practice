name: Playwright QA Tests

on:
  push:
    branches: 
      - main
      - feature

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Playwright install karo
        run: |
          pip install playwright pytest-playwright
          playwright install chromium

      - name: Tests chalao
        run: pytest CICD-TestCases/TestCases/Nopcommerce.py --headless --screenshot=on

      - name: Screenshots aur report save karo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            screenshots/
            test-results/
